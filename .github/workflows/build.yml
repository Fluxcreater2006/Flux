name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - name: Build
        run: |
          unzip -q FluxApp.zip
          cd FluxApp
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q vosk-model-small-en-in-0.4.zip
          mv vosk-model-small-en-in-0.4 app/src/main/assets/model
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Flux-APK
          path: FluxApp/app/build/outputs/apk/debug/app-debug.apk
